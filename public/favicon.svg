<!--
  The Postline mark: a post on a line. A pale stem and the signal dot beside
  its top make a P, on the ink tile. Three flat shapes, so it reads in a 16px
  tab and needs no font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Postline">
  <rect width="64" height="64" rx="15" fill="#0a0a0b"/>
  <rect x="17.5" y="15" width="7" height="34" rx="3.5" fill="#fafafa"/>
  <circle cx="36.25" cy="25.5" r="10.5" fill="#f0441e"/>
</svg>
