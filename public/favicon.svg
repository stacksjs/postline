<!--
  The Postline mark: a signal dot on an ink tile. Two flat shapes, so it reads
  in a 16px tab and needs no font.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Postline">
  <rect width="64" height="64" rx="15" fill="#0a0a0b"/>
  <circle cx="32" cy="32" r="10" fill="#f0441e"/>
</svg>
