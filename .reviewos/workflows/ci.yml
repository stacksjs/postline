# CI on ReviewOS (reviewos.org/stacks/postline).
#
# Postline's code lives on GitHub; ReviewOS mirrors it, runs this file on every
# commit the mirror fetches, and posts the verdict back to the commit as the
# status "ReviewOS / CI", so it shows on GitHub where the code is pushed.
#
# ReviewOS reads `.reviewos/workflows` instead of `.github/workflows` when it
# exists, so nothing under `.github/workflows` runs there.
#
# Every job runs on Postline's own Mac runner,
# `[self-hosted, macos-arm64, postline]`. A runner takes a job only when it
# carries every label the job asks for, so no other project's runner picks
# these up and this one picks up nothing else. The instance's Linux pools
# serve other repositories and are not used here.
#
# Bun comes from the pinned Pantry action, the same way on every runner. The
# checkout is done by the runner before the first step, so there is no
# checkout step to write.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a branch replaces its older run. Main finishes every run, so
# each commit there has a verdict of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: 1.4.4

jobs:
  lint:
    reviewos:
      secrets: []
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 15
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      # The stx conformance checks against config/lint.ts baselines: a new
      # document.querySelector or inline style in a view fails here (#77).
      - name: Lint stx templates
        run: ./buddy lint --stx

  typecheck:
    reviewos:
      secrets: []
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 15
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck:app

  test:
    reviewos:
      secrets: []
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 20
    # The database the suite runs on. Postline runs on SQLite, and a runner has
    # no `.env`, so without these the connection defaults to MySQL with no
    # password and every test that reaches the database fails.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE_PATH: database/postline_ci.sqlite
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The feature tests exercise real routes, and a route needs its tables.
      - name: Create the test database
        run: bun node_modules/@stacksjs/buddy/dist/cli.js migrate
      - name: Test suite
        run: bun run test

  # The Mac app's agent, compiled and run from an empty directory the way the
  # app runs it. The release workflow has always done this before imaging the
  # app; doing it here too means a change that breaks the agent fails on the
  # commit that made it, not on the next tag.
  desktop:
    reviewos:
      secrets: []
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 20
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Write what the agent carries
        run: bun scripts/desktop-bundle.ts
      - name: Check the compiled agent
        run: |
          CHECK_DIR="$(mktemp -d)"
          bun build --compile scripts/desktop-check.ts --outfile "$CHECK_DIR/postline-check"
          (cd "$CHECK_DIR" && ./postline-check)

  # The site as a static host serves it (#179): every page built, every client
  # script bundled to JavaScript, and no TypeScript left for a browser to fetch.
  site:
    reviewos:
      secrets: []
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 20
    # As for the tests: a runner has no `.env`, and anything the build reads
    # from the database must not default to MySQL.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE_PATH: database/postline_ci_site.sqlite
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the site
        run: bun run build:frontend
      - name: Marketing metadata and sitemap
        run: bun scripts/marketing-check.ts
      - name: Build and check documentation
        run: |
          ./buddy build:docs
          bun scripts/docs-check.ts
      - name: No TypeScript in the build
        run: |
          LEFT="$(find dist -name '*.ts')"
          if [ -n "$LEFT" ]; then echo "TypeScript left in dist/:"; echo "$LEFT"; exit 1; fi
      # Script, CSS and font weight per app page, and nothing fetched from
      # another origin (#188).
      - name: Weight budgets
        run: bun scripts/budget-check.ts

  # Every workspace view in a real browser, signed in, light, dark and on a
  # phone (#80): fails on console errors, failed requests and pages wider than
  # the screen. The screenshots stay with the run.
  browser:
    reviewos:
      secrets: []
      artifact-paths:
        - storage/framework/browser-check/*.png
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 25
    steps:
      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0
      - name: Follow the README on the clean checkout
        run: bun scripts/readme-check.ts
      - name: Write the migrated database the check starts from
        run: bun scripts/desktop-bundle.ts
      - name: Open every view
        run: bun scripts/browser-check.ts
