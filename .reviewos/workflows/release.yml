# The desktop release, on ReviewOS (reviewos.org/stacks/postline).
#
# `bun run release:minor` bumps package.json, writes the changelog, commits,
# tags vX.Y.Z and pushes. Wait for CI to pass on that commit, then dispatch
# this workflow with the approved tag to build the DMG and publish it.
#
# It runs on Postline's own Mac runner, because building a Mac app needs a
# Mac: `[self-hosted, macos-arm64, postline]`. A runner takes a job only when
# it carries every label a job asks for, so nobody else's Mac runner picks
# this up, and this one picks up nothing else.
#
# NEEDED ON THE INSTANCE before the first release:
#   secret   GH_RELEASE_TOKEN a GitHub token that may create releases on
#                             stacksjs/postline (contents: write)
#   variable DESKTOP_NOTARY_PROFILE name of the approved notarytool profile
#   Keychain service postline-desktop-updates holds the signing and storage keys
#
# Why a token of its own: inside a ReviewOS job `GITHUB_TOKEN` and
# `GITHUB_API_URL` are ReviewOS's, and ReviewOS answers no releases API there.
# The release is published on GitHub, where the code and the downloads are, so
# the publish step is pointed at GitHub by name.
#
# The app is self-contained: it serves Postline from inside itself, so there
# is no address to configure and nothing has to be deployed first.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach the DMG to, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4

jobs:
  desktop:
    name: Desktop DMG (macOS arm64)
    reviewos:
      secrets: [GH_RELEASE_TOKEN]
      # Kept with the run as well, so a release that fails to publish still
      # leaves the DMG it built.
      artifact-paths:
        - storage/framework/desktop-dmg/*.dmg
        - storage/framework/desktop-dmg/checksums.txt
        - storage/framework/desktop-dmg/checksums.txt.sig
        - storage/framework/desktop-dmg/release-manifest.json
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 30
    env:
      DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_SIGNING_IDENTITY }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0

      # Start the artifact build from the tag after the runner sets up tools.
      - name: Prepare the approved tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git worktree add --detach "$RUNNER_TEMP/postline-release" "refs/tags/$TAG"

      - name: Check the tag matches package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postline-release"
          declared=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)
          test "$declared" = "$VERSION" || { echo "::error::Tag v$VERSION does not match package.json version $declared." >&2; exit 1; }

      - name: Require passing CI on the approved tag
        run: |
          cd "$RUNNER_TEMP/postline-release"
          bun scripts/publication-check.ts --ci-only

      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP/postline-release"
          bun install --frozen-lockfile

      # The routes, actions, middleware, migrations and a freshly migrated
      # empty database, written where the bundler can follow them. The agent
      # is one compiled binary and carries all of it.
      - name: Write what the agent carries
        run: |
          cd "$RUNNER_TEMP/postline-release"
          bun scripts/desktop-bundle.ts

      # The agent, compiled and run from an empty directory the way the app
      # runs it: every page left to the views, the API answering, a post
      # published and read back from the database. A release whose agent
      # cannot do that is not imaged.
      - name: Check the compiled agent
        run: |
          cd "$RUNNER_TEMP/postline-release"
          CHECK_DIR="$(mktemp -d)"
          bun build --compile scripts/desktop-check.ts --outfile "$CHECK_DIR/postline-check"
          (cd "$CHECK_DIR" && ./postline-check)

      # Compiles the agent with the built views inside it and assembles
      # Postline.app. The Craft web view runtime is the one Craft published for
      # the installed craft-native version: the build fetches it, and passes
      # over a `craft` shim on the runner's PATH.
      #
      - name: Build the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postline-release"
          if [[ ! "${DESKTOP_SIGNING_IDENTITY:-}" =~ ^[[:xdigit:]]{40}$ && "${DESKTOP_SIGNING_IDENTITY:-}" != 'Developer ID Application: '* ]]; then
            echo '::error::Set DESKTOP_SIGNING_IDENTITY to the approved Developer ID certificate name or fingerprint.' >&2
            exit 1
          fi
          # CFBundleVersion, so two builds of one version can be told apart
          # (#203): the number of commits behind this one, which only grows.
          DESKTOP_BUILD_NUMBER="$(git rev-list --count HEAD)"
          export DESKTOP_BUILD_NUMBER
          bun node_modules/@stacksjs/buddy/dist/cli.js build:desktop
          app=storage/framework/desktop/webview/darwin-arm64/Postline.app
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep '^Authority=Developer ID Application:'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"

      - name: Notarize and publish the signed desktop update
        env:
          DESKTOP_NOTARY_PROFILE: ${{ vars.DESKTOP_NOTARY_PROFILE }}
          POSTLINE_UPDATES_BUCKET: postline-desktop-updates-923076644019
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postline-release"
          test -n "$DESKTOP_NOTARY_PROFILE" || { echo '::error::Set DESKTOP_NOTARY_PROFILE to the approved notarytool profile.' >&2; exit 1; }

          update_secret() {
            bun -e '
              const value = await Bun.secrets.get({ service: "postline-desktop-updates", name: Bun.argv[1] })
              if (!value) throw new Error("A required release credential is missing from the runner’s Keychain.")
              process.stdout.write(value)
            ' "$1"
          }
          DESKTOP_UPDATE_PRIVATE_KEY=$(update_secret main)
          POSTLINE_UPDATES_ACCESS_KEY_ID=$(update_secret storage-access-key-id)
          POSTLINE_UPDATES_SECRET_ACCESS_KEY=$(update_secret storage-secret-access-key)
          export DESKTOP_UPDATE_PRIVATE_KEY POSTLINE_UPDATES_ACCESS_KEY_ID POSTLINE_UPDATES_SECRET_ACCESS_KEY

          bun scripts/desktop-feed-check.ts
          ./buddy release:desktop --target darwin-arm64 --skip-build
          bun scripts/desktop-feed-check.ts "$VERSION"

      - name: Verify and collect the notarized disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/postline-release/storage/framework/desktop/webview/release/darwin-arm64"
          target=storage/framework/desktop-dmg
          mkdir -p "$target"
          dmg="$target/Postline-$VERSION-macos-arm64.dmg"
          cp "$staged/Postline-$VERSION-arm64.dmg" "$dmg"
          cp "$staged/latest.json" "$target/release-manifest.json"
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the checksums
        env:
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          artifact="$(pwd)/$DMG"
          cd "$RUNNER_TEMP/postline-release"
          bun scripts/release-checksums.ts sign "$artifact"

      # Published on GitHub through the Pantry action: notes from this
      # version's section of CHANGELOG.md, the DMG and a checksums file. The
      # three variables below name GitHub explicitly, because the ones a
      # ReviewOS job inherits name ReviewOS.
      - name: Publish the GitHub release
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          release: 'true'
          release-tag: ${{ steps.version.outputs.tag }}
          release-files: |
            ${{ steps.dmg.outputs.path }}
            storage/framework/desktop-dmg/checksums.txt
            storage/framework/desktop-dmg/checksums.txt.sig
            storage/framework/desktop-dmg/release-manifest.json
          release-changelog: CHANGELOG.md
          release-notes: Postline ${{ steps.version.outputs.version }} for macOS (Apple Silicon).
          release-token: ${{ secrets.GH_RELEASE_TOKEN }}
        env:
          GITHUB_API_URL: https://api.github.com
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: stacksjs/postline
