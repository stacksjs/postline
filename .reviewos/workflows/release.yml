# The desktop release, on ReviewOS (reviewos.org/stacks/postline).
#
# `bun run release:minor` bumps package.json, writes the changelog, commits,
# tags vX.Y.Z and pushes. ReviewOS mirrors the tag and runs this file: build
# the macOS app, package it as a DMG, and publish a GitHub release with the
# DMG attached.
#
# It runs on Postline's own Mac runner, because building a Mac app needs a
# Mac: `[self-hosted, macos-arm64, postline]`. A runner takes a job only when
# it carries every label a job asks for, so nobody else's Mac runner picks
# this up, and this one picks up nothing else.
#
# NEEDED ON THE INSTANCE before the first release:
#   secret   GH_RELEASE_TOKEN a GitHub token that may create releases on
#                             stacksjs/postline (contents: write)
#
# Why a token of its own: inside a ReviewOS job `GITHUB_TOKEN` and
# `GITHUB_API_URL` are ReviewOS's, and ReviewOS answers no releases API there.
# The release is published on GitHub, where the code and the downloads are, so
# the publish step is pointed at GitHub by name.
#
# The app is self-contained: it serves Postline from inside itself, so there
# is no address to configure and nothing has to be deployed first.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach the DMG to, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4

jobs:
  desktop:
    name: Desktop DMG (macOS arm64)
    reviewos:
      secrets: [GH_RELEASE_TOKEN]
      # Kept with the run as well, so a release that fails to publish still
      # leaves the DMG it built.
      artifact-paths:
        - storage/framework/desktop-dmg/*.dmg
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 30
    env:
      # Optional Developer ID signing, picked up by build:desktop when set.
      # Unset, the app is signed with whatever development certificate the
      # runner has, and Gatekeeper asks on first open.
      DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_SIGNING_IDENTITY }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The runner checked out the commit the event names. A manual run names
      # a branch, so move to the tag it was asked to build.
      - name: Check out the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git checkout --detach "refs/tags/$TAG"

      - name: Check the tag matches package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)
          test "$declared" = "$VERSION" || { echo "::error::Tag v$VERSION does not match package.json version $declared." >&2; exit 1; }

      - name: Set up Pantry and Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@${{ env.BUN_VERSION }} git-scm.org@2.53.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The routes, actions, middleware, migrations and a freshly migrated
      # empty database, written where the bundler can follow them. The agent
      # is one compiled binary and carries all of it.
      - name: Write what the agent carries
        run: bun scripts/desktop-bundle.ts

      # The agent, compiled and run from an empty directory the way the app
      # runs it: every page left to the views, the API answering, a post
      # published and read back from the database. A release whose agent
      # cannot do that is not imaged.
      - name: Check the compiled agent
        run: |
          CHECK_DIR="$(mktemp -d)"
          bun build --compile scripts/desktop-check.ts --outfile "$CHECK_DIR/postline-check"
          (cd "$CHECK_DIR" && ./postline-check)

      # Compiles the agent with the built views inside it and assembles
      # Postline.app. The Craft web view runtime is the one Craft published for
      # the installed craft-native version: the build fetches it, and passes
      # over a `craft` shim on the runner's PATH.
      #
      # ReviewOS leaves an expression it cannot resolve as written, where
      # GitHub would make it empty. With no DESKTOP_SIGNING_IDENTITY variable on
      # the instance the build would be told to sign as that literal text, so
      # an unresolved one is dropped and the build signs with the runner's own
      # development certificate.
      - name: Build the app
        run: |
          set -euo pipefail
          case "${DESKTOP_SIGNING_IDENTITY:-}" in
            ''|*vars.DESKTOP_SIGNING_IDENTITY*) unset DESKTOP_SIGNING_IDENTITY ;;
          esac
          bun node_modules/@stacksjs/buddy/dist/cli.js build:desktop

      # A disk image with the app and a link to Applications, which is what a
      # person expects to open. Named for the platform it runs on, so a later
      # Intel or Windows build can sit beside it in the same release.
      - name: Make the disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=storage/framework/desktop/webview/darwin-arm64/Postline.app
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          stage="$RUNNER_TEMP/postline-dmg"
          rm -rf "$stage"
          mkdir -p "$stage" storage/framework/desktop-dmg
          ditto "$app" "$stage/Postline.app"
          ln -s /Applications "$stage/Applications"
          dmg="storage/framework/desktop-dmg/Postline-$VERSION-macos-arm64.dmg"
          rm -f "$dmg"
          hdiutil create -volname "Postline $VERSION" -srcfolder "$stage" -format UDZO -ov "$dmg"
          hdiutil verify "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      # Published on GitHub through the Pantry action: notes from this
      # version's section of CHANGELOG.md, the DMG and a checksums file. The
      # three variables below name GitHub explicitly, because the ones a
      # ReviewOS job inherits name ReviewOS.
      - name: Publish the GitHub release
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          release: 'true'
          release-tag: ${{ steps.version.outputs.tag }}
          release-files: ${{ steps.dmg.outputs.path }}
          release-checksums: sha256
          release-changelog: CHANGELOG.md
          release-notes: Postline ${{ steps.version.outputs.version }} for macOS (Apple Silicon).
          release-token: ${{ secrets.GH_RELEASE_TOKEN }}
        env:
          GITHUB_API_URL: https://api.github.com
          GITHUB_SERVER_URL: https://github.com
          GITHUB_REPOSITORY: stacksjs/postline
