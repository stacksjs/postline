name: Deploy Postline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the checked main commit or restore the previous release
        type: choice
        options: [deploy, rollback]
        default: deploy

concurrency:
  group: postline-production
  cancel-in-progress: false

jobs:
  production:
    environment: production
    runs-on: [self-hosted, macos-arm64, postline]
    timeout-minutes: 30
    reviewos:
      secrets: [POSTLINE_HETZNER_TOKEN, DOTENV_PRIVATE_KEY_PRODUCTION]
    steps:
      - name: Require the checked main commit
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          test "$DEPLOY_REF" = refs/heads/main
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          case "$DEPLOY_OPERATION" in deploy|rollback) ;; *) exit 1 ;; esac

      - name: Set up Bun
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          version: 0.11.207
          install: 'false'
          packages: bun.sh@1.4.4

      - name: Prepare the verified source
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/postline-deploy" "$DEPLOY_SHA"

      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP/postline-deploy"
          bun install --frozen-lockfile

      - name: Require passing CI before deploying
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          cd "$RUNNER_TEMP/postline-deploy"
          STACKS_PUBLICATION_CHANNEL=web bun run publication:check

      - name: Deploy
        id: deploy
        if: ${{ inputs.operation == 'deploy' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.POSTLINE_HETZNER_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          cd "$RUNNER_TEMP/postline-deploy"
          ./buddy deploy production --yes

      - name: Check public HTTPS and the short hostname
        id: verify
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          set -eu
          public_request() {
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 60 --connect-timeout 5 --max-time 15 "$@"
          }
          # Each hostname can become ready independently while the gateway obtains TLS certificates.
          healthy=false
          for attempt in $(seq 1 18); do
            if health=$(curl --fail --silent --max-time 5 https://postline.theopentimes.org/api/postline/health) \
              && printf '%s\n' "$health" | bun -e '
                const health = await Bun.stdin.json()
                const checks = [health.database, health.scheduler, health.disk, health.migrations]
                process.exit(health.ok === true && checks.every(check => check === "ok") ? 0 : 1)
              '; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            echo 'Postline did not pass its public health check.' >&2
            exit 1
          fi
          primary=$(public_request https://postline.theopentimes.org/)
          printf '%s\n' "$primary" | grep -F 'https://postline.theopentimes.org/' > /dev/null
          docs=$(public_request https://postline.theopentimes.org/docs/)
          printf '%s\n' "$docs" | grep -F '/docs/compose' > /dev/null
          compose=$(public_request https://postline.theopentimes.org/docs/compose)
          printf '%s\n' "$compose" | grep -F 'Compose a post' > /dev/null
          redirect=$(public_request -o /dev/null -w '%{http_code} %{redirect_url}' 'https://postline.theot.org/download?source=deploy')
          test "$redirect" = '301 https://postline.theopentimes.org/download?source=deploy'

          cd "$RUNNER_TEMP/postline-deploy"
          bun scripts/desktop-feed-check.ts

      - name: Roll back sites switched by a failed deployment
        if: ${{ failure() && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        env:
          HCLOUD_TOKEN: ${{ secrets.POSTLINE_HETZNER_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          cd "$RUNNER_TEMP/postline-deploy"
          ./buddy deploy:rollback --env production --all --only-if-live "$(git rev-parse --short=7 HEAD)"

      - name: Restore the previous release
        if: ${{ inputs.operation == 'rollback' }}
        env:
          HCLOUD_TOKEN: ${{ secrets.POSTLINE_HETZNER_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          cd "$RUNNER_TEMP/postline-deploy"
          ./buddy deploy:rollback --env production --all
