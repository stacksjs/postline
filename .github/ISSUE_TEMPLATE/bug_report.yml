name: Bug report
description: Something in Postline does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the composer
        2. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run Postline
      options:
        - Mac app
        - Self-hosted from source
        - Development (./buddy dev)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.1
    validations:
      required: true
  - type: checkboxes
    id: networks
    attributes:
      label: Networks involved
      options:
        - label: Bluesky
        - label: X
        - label: LinkedIn
        - label: Instagram
        - label: Threads
        - label: Mastodon
        - label: Blog
        - label: None, or not network-specific
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove access tokens, app passwords and anything else private before pasting.
      render: Shell
