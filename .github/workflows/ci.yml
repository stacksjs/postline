name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to production after lint, typecheck and tests pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports: ['3306:3306']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Test suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  # AUTOMATIC DEPLOYS ARE OFF.
  #
  # This job used to run on every push to main. The server, secrets and
  # `production` environment it deploys with still belong to the publication
  # product that was split out of this repo into its own, and that box is live
  # — so a push here must never deploy. Until Postline has its own server (or
  # tenant and ports), its own domain and its own secrets, this job runs ONLY
  # when someone starts the workflow by hand from main with the `deploy` input
  # ticked. A push, a pull request, or a manual run without the input skips it.
  #
  # Before the first manual deploy: replace the HCLOUD_TOKEN /
  # DOTENV_PRIVATE_KEY_PRODUCTION / DEPLOY_SSH_PRIVATE_KEY secrets and the host
  # in the SSH step with Postline's own, commit a Postline `.env.production`,
  # and check config/cloud.ts against the target box.
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Verify deployment credentials
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$HCLOUD_TOKEN"
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 root@178.105.248.188 true
      - name: Deploy production
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js deploy production --yes
      - name: Verify production routes
        run: |
          # Verify the canonical host (config/domains.ts). Postline has no
          # redirect hosts yet, so there is no second redirect check; add one
          # here when an apex domain is registered and the subdomain starts
          # redirecting to it.
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://postline.stacksjs.com/login > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://postline.stacksjs.com/api/v1/status | grep -q '"status":"ok"'
          # The realtime gateway route. A plain GET is not an upgrade request,
          # so the broadcast server answers 400 — which is proof the route
          # reaches it rather than 404ing at the gateway.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://postline.stacksjs.com/ws)" = '400'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://postline.stacksjs.com/campaigns)
          test "$status" = '200' || test "$status" = '302' || test "$status" = '303'
