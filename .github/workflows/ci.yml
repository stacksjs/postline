name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports: ['3306:3306']
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ['8000:8000']
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Test suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Verify deployment credentials
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          test -n "$HCLOUD_TOKEN"
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
      - name: Install deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 root@178.105.248.188 true
      - name: Deploy production
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js deploy production --yes
      - name: Verify production routes
        run: |
          # Verify the canonical host. opentimes.stacksjs.com is configured as a
          # redirect to it, and curl does not follow redirects without -L, so
          # checking the redirect host asserted against an empty body and failed
          # a deploy that had in fact succeeded.
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://theopentimes.org/login > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://theopentimes.org/api/v1/status | grep -q '"status":"ok"'
          # The realtime gateway route. A plain GET is not an upgrade request,
          # so the broadcast server answers 400 — which is proof the route
          # reaches it rather than 404ing at the gateway.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://theopentimes.org/ws)" = '400'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://theopentimes.org/campaigns)
          test "$status" = '200' || test "$status" = '302' || test "$status" = '303'
      - name: Verify the redirect hosts, across both DNS accounts
        run: |
          # These hosts span two providers: theot.* are Porkbun zones, the
          # stacksjs.com hosts are records in a Route53 zone owned by a
          # different cloud account. One `buddy deploy` publishes both, and
          # this is the assertion that it kept doing so — a provider that
          # silently stops being reconciled shows up here as a redirect that
          # went missing, not as a support ticket months later.
          #
          # Asserted without -L on purpose: the redirect itself is what is
          # under test, so following it would pass even if the host had started
          # serving the site directly (which is exactly how the duplicate
          # content on postline.stacksjs.com went unnoticed).
          for host in \
            www.theopentimes.org \
            theot.org \
            theot.app \
            theot.blog \
            opentimes.stacksjs.com \
            postline.stacksjs.com
          do
            location=$(curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
              --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://$host/deep/link")
            echo "  $host -> $location"
            # 301 to the canonical host, with the path carried across.
            case "$location" in
              '301 https://theopentimes.org/deep/link') ;;
              *) echo "::error::$host did not 301 to the canonical host with its path preserved (got: $location)"; exit 1 ;;
            esac
          done
