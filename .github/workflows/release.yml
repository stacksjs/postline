name: Release

# `bun run release:minor` (likewise :patch / :major) bumps package.json, writes
# the changelog, commits, tags vX.Y.Z and pushes the tag. That tag lands here:
# build the macOS desktop app, package it as a DMG, and publish a GitHub release
# with the DMG attached.
#
# The release itself (notes from CHANGELOG.md, the DMG and its checksums) is
# created by the Pantry action, so this file holds no `gh release` scripting.
#
# REQUIRED before the first release: the repository variable DESKTOP_URL.
# The desktop app is a native window around a running Postline, and that
# variable is the address it opens. There is deliberately no default: the app
# would otherwise ship pointing at whatever happens to answer on a guessed
# host, and a release is the wrong moment to find that out.
#
# Mac App Store delivery is its own, manually dispatched workflow
# (apple-app-store.yml); it needs Apple signing material this one does not.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach the DMG to, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.4'
  # Prebuilt Craft runtime, pinned by release and checksum. Building it from
  # source would pin a Zig *dev* toolchain, which ziglang.org prunes as soon as
  # master moves on. v0.0.118 is the first release with --persistent-storage
  # and --no-web-chrome-controls, which app/Desktop/launcher.ts passes.
  CRAFT_VERSION: v0.0.118
  CRAFT_SHA256_ARM64: bba1ff388afc70e734b6ac955c52dbd1c90da723a3f458c311d3aec592fb0bec

jobs:
  desktop:
    name: Desktop DMG (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_NAME: Postline
      DESKTOP_APP_NAME: Postline
      DESKTOP_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'org.stacksjs.postline' }}
      # The page the window opens: the signed-in workspace of a running
      # Postline. Required; see the note at the top of this file.
      DESKTOP_URL: ${{ vars.DESKTOP_URL }}
      # A tagged build is the stable channel. Unset, the manifest says
      # "experimental", which is what a local build is.
      DESKTOP_RELEASE_CHANNEL: stable
      # Optional Developer ID signing + notarization, picked up by build:dmg
      # when set. Unset, the DMG is unsigned and Gatekeeper asks on first open.
      DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_SIGNING_IDENTITY }}
      DESKTOP_NOTARY_PROFILE: ${{ vars.DESKTOP_NOTARY_PROFILE }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Before anything is built: a release with nowhere for the app to open
      # is not a release.
      - name: Require the app's address
        run: |
          set -euo pipefail
          case "$DESKTOP_URL" in
            https://*) ;;
            '') echo "::error::Set the repository variable DESKTOP_URL to the https address of the Postline the desktop app opens (for example https://postline.example.com/composer)." >&2; exit 1 ;;
            *) echo "::error::DESKTOP_URL must be an https address, got: $DESKTOP_URL" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      # The tag and package.json must agree, or the DMG would be named for one
      # version and report another in its About box.
      - name: Check the tag matches package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)
          test "$declared" = "$VERSION" || { echo "::error::Tag v$VERSION does not match package.json version $declared." >&2; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Fetch pinned Craft runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/craft"
          gh release download "$CRAFT_VERSION" -R craft-native/craft -p craft-darwin-arm64.zip -D "$RUNNER_TEMP/craft"
          echo "$CRAFT_SHA256_ARM64  $RUNNER_TEMP/craft/craft-darwin-arm64.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/craft/craft-darwin-arm64.zip" -d "$RUNNER_TEMP/craft"
          test "$(lipo -archs "$RUNNER_TEMP/craft/craft")" = arm64
          echo "CRAFT_BIN=$RUNNER_TEMP/craft/craft" >> "$GITHUB_ENV"

      - name: Build desktop app
        run: bun node_modules/@stacksjs/buddy/dist/cli.js build:desktop

      - name: Package DMG
        env:
          DESKTOP_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js build:dmg

      # Named for the platform it runs on, so a later Intel or Windows build
      # can sit beside it in the same release without a rename.
      - name: Name the DMG for its platform
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd storage/framework/desktop-dmg
          test -f "Postline-$VERSION.dmg"
          mv "Postline-$VERSION.dmg" "Postline-$VERSION-macos-arm64.dmg"
          echo "path=storage/framework/desktop-dmg/Postline-$VERSION-macos-arm64.dmg" >> "$GITHUB_OUTPUT"

      # Creates the release for the tag when there is none, takes its notes
      # from this version's section of CHANGELOG.md, and attaches the DMG with
      # a checksums file. `install: false` because nothing here needs Pantry to
      # install packages: the action is used for the release alone.
      - name: Publish the GitHub release
        uses: pantry-pm/pantry/packages/action@be9f7a5b0af91351f5c0b7ea3b2fa98e267753a8 # v0.11.207
        with:
          install: 'false'
          release: 'true'
          release-tag: ${{ steps.version.outputs.tag }}
          release-files: ${{ steps.dmg.outputs.path }}
          release-checksums: sha256
          release-changelog: CHANGELOG.md
          release-notes: Postline ${{ steps.version.outputs.version }} for macOS (Apple Silicon).
        env:
          GITHUB_TOKEN: ${{ github.token }}
