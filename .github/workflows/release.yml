name: Release

# `bun run release:patch` (likewise :minor / :major) bumps package.json, writes
# the changelog, commits, tags vX.Y.Z and pushes the tag. That tag lands here:
# build the macOS desktop app, package it as a DMG, zip it, and attach it to
# the GitHub release for the tag.
#
# This file used to be a copy of the Stacks *framework's* releaser — publishing
# npm packages and a Homebrew formula this app does not have — so every tag
# failed before building anything.
#
# Mac App Store delivery is its own, manually dispatched workflow
# (apple-app-store.yml); it needs Apple signing material this one does not.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and attach the DMG to, e.g. v0.0.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.2'
  # Prebuilt Craft runtime, pinned by release and checksum. Building it from
  # source would pin a Zig *dev* toolchain, which ziglang.org prunes as soon as
  # master moves on. v0.0.118 is the first release with --persistent-storage
  # and --no-web-chrome-controls, which app/Desktop/launcher.ts passes.
  CRAFT_VERSION: v0.0.118
  CRAFT_SHA256_ARM64: bba1ff388afc70e734b6ac955c52dbd1c90da723a3f458c311d3aec592fb0bec

jobs:
  desktop:
    name: Desktop DMG (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_NAME: The Open Times
      DESKTOP_APP_NAME: The Open Times
      DESKTOP_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'org.theopentimes.desktop' }}
      # The page the window opens: the signed-in workspace on the deployed site.
      DESKTOP_URL: ${{ vars.DESKTOP_URL || 'https://theopentimes.org/composer' }}
      # Optional Developer ID signing + notarization, picked up by build:dmg
      # when set. Unset, the DMG is unsigned and Gatekeeper asks on first open.
      DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_SIGNING_IDENTITY }}
      DESKTOP_NOTARY_PROFILE: ${{ vars.DESKTOP_NOTARY_PROFILE }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Fetch pinned Craft runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/craft"
          gh release download "$CRAFT_VERSION" -R craft-native/craft -p craft-darwin-arm64.zip -D "$RUNNER_TEMP/craft"
          echo "$CRAFT_SHA256_ARM64  $RUNNER_TEMP/craft/craft-darwin-arm64.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/craft/craft-darwin-arm64.zip" -d "$RUNNER_TEMP/craft"
          test "$(lipo -archs "$RUNNER_TEMP/craft/craft")" = arm64
          echo "CRAFT_BIN=$RUNNER_TEMP/craft/craft" >> "$GITHUB_ENV"

      - name: Build desktop app
        run: bun node_modules/@stacksjs/buddy/dist/cli.js build:desktop

      - name: Package DMG
        env:
          DESKTOP_APP_VERSION: ${{ steps.version.outputs.version }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js build:dmg

      - name: Zip DMG
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd storage/framework/desktop-dmg
          dmg="$DESKTOP_APP_NAME-$VERSION.dmg"
          test -f "$dmg"
          zip="The-Open-Times-$VERSION-macos-arm64.dmg.zip"
          ditto -c -k --keepParent "$dmg" "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "zip=storage/framework/desktop-dmg/$zip" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # The release commit put this version's section at the top of the
            # changelog; use it as the notes, or let GitHub write them.
            awk -v v="v$VERSION" '
              /^## / { if (found) exit; if ($0 ~ v "([^0-9.]|$)") { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
            if [ -s "$RUNNER_TEMP/notes.md" ]; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
