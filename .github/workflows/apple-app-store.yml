name: Publish Mac App Store

# Build, sandbox, sign and deliver the desktop app to App Store Connect.
# Run it by hand against a release tag once the Apple prerequisites below are
# in place; start with validate-only (the default) and upload only after the
# signed build passes a local launch.
#
# Adapted from the shared stacksjs/stacks desktop-app-store.yml, which this app
# cannot call as-is: it has no input for the app icon (a Store build without
# one is rejected at review), it pins a Craft too old for the flags
# app/Desktop/launcher.ts passes, and it compiles Craft against a Zig dev build
# that ziglang.org has since pruned.
#
# Repository secrets (Apple-owned, nothing here can mint them):
#   APPLE_APP_CERTIFICATE_BASE64        Mac App Distribution identity, .p12
#   APPLE_INSTALLER_CERTIFICATE_BASE64  Mac Installer Distribution identity, .p12
#   APPLE_CERTIFICATE_PASSWORD          password both .p12 files were exported with
#   APPLE_PROVISIONING_PROFILE_BASE64   Mac App Store profile for the bundle id
#   APP_STORE_CONNECT_API_KEY           .p8 contents
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#
# Repository variables:
#   APPLE_TEAM_ID                       required
#   APPLE_BUNDLE_ID                     default org.theopentimes.desktop
#   APPLE_APP_NAME                      default "The Open Times"
#   DESKTOP_URL                         default https://theopentimes.org/composer

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to build, e.g. v0.0.3
        required: true
        type: string
      validate-only:
        description: Validate the signed package without uploading it
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  BUN_VERSION: '1.4.2'
  # Same pinned runtime as release.yml, both slices for a universal binary.
  CRAFT_VERSION: v0.0.118
  CRAFT_SHA256_ARM64: bba1ff388afc70e734b6ac955c52dbd1c90da723a3f458c311d3aec592fb0bec
  CRAFT_SHA256_X64: 8fb96ebe5088525e2addb30ea3b27bf50134cd1d1965d8d16b5ae62204770574

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_NAME: ${{ vars.APPLE_APP_NAME || 'The Open Times' }}
      APPLE_APP_NAME: ${{ vars.APPLE_APP_NAME || 'The Open Times' }}
      APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'org.theopentimes.desktop' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_APP_CATEGORY: public.app-category.social-networking
      APPLE_MINIMUM_MACOS: '13.0'
      APPLE_APP_ICON: app/Desktop/AppIcon.icns
      APPLE_UNIVERSAL: 'true'
      DESKTOP_URL: ${{ vars.DESKTOP_URL || 'https://theopentimes.org/composer' }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Resolve marketing version
        id: version
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "Not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag }}

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Fetch pinned Craft runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/craft"
          mkdir -p "$dir/arm64" "$dir/x64"
          gh release download "$CRAFT_VERSION" -R craft-native/craft -p 'craft-darwin-*.zip' -D "$dir"
          echo "$CRAFT_SHA256_ARM64  $dir/craft-darwin-arm64.zip" | shasum -a 256 -c -
          echo "$CRAFT_SHA256_X64  $dir/craft-darwin-x64.zip" | shasum -a 256 -c -
          unzip -q "$dir/craft-darwin-arm64.zip" -d "$dir/arm64"
          unzip -q "$dir/craft-darwin-x64.zip" -d "$dir/x64"
          test "$(lipo -archs "$dir/arm64/craft")" = arm64
          test "$(lipo -archs "$dir/x64/craft")" = x86_64
          {
            echo "CRAFT_BIN=$dir/arm64/craft"
            echo "CRAFT_BIN_ARM64=$dir/arm64/craft"
            echo "CRAFT_BIN_X64=$dir/x64/craft"
          } >> "$GITHUB_ENV"

      # The Action creates an ephemeral keychain, imports both identities and
      # the provisioning profile, and deletes the keychain in its post step.
      - name: Import Apple signing identities
        id: signing
        uses: pantry-pm/pantry/packages/action@d899150a11cd12157ea360e21f6800a85f900446 # v0.11.71
        with:
          version: '0.11.71'
          install: 'false'
          apple-signing: 'true'
          apple-signing-application-certificate: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          apple-signing-installer-certificate: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          apple-signing-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-provisioning-profile: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}

      - name: Configure Apple profile and App Store Connect key
        env:
          PROVISIONING_PROFILE_PATH: ${{ steps.signing.outputs.apple-signing-provisioning-profile }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$API_KEY" > "$keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "APPLE_PROVISIONING_PROFILE=$PROVISIONING_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Verify Mac App Store prerequisites
        env:
          APPLE_APP_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple-signing-identity }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple-signing-installer-identity }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js desktop:apple:doctor

      - name: Build and sign Mac App Store package
        env:
          APPLE_BUILD_NUMBER: ${{ github.run_number }}
          APPLE_APP_VERSION: ${{ steps.version.outputs.value }}
          APPLE_APP_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple-signing-identity }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ steps.signing.outputs.apple-signing-installer-identity }}
        run: bun node_modules/@stacksjs/buddy/dist/cli.js desktop:apple:publish --package-only

      - name: Attach package to the release and deliver it
        uses: pantry-pm/pantry/packages/action@d899150a11cd12157ea360e21f6800a85f900446 # v0.11.71
        with:
          version: '0.11.71'
          install: 'false'
          release: 'true'
          release-tag: ${{ inputs.release-tag }}
          release-files: |
            storage/framework/desktop-dist/apple/*.pkg
            storage/framework/desktop-dist/apple/checksums.sha256
            storage/framework/desktop-dist/apple/apple-provenance.json
          release-checksums: sha256
          release-app-store: 'true'
          release-app-store-bundle-id: ${{ env.APPLE_BUNDLE_ID }}
          release-app-store-version: ${{ steps.version.outputs.value }}
          release-app-store-build-number: ${{ github.run_number }}
          release-app-store-api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          release-app-store-issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          release-app-store-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          release-app-store-validate-only: ${{ inputs.validate-only }}
          release-app-store-retry-existing: 'true'
          release-token: ${{ github.token }}

      - name: Upload signed package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-app-store-${{ github.sha }}
          path: |
            storage/framework/desktop-dist/apple/*.pkg
            storage/framework/desktop-dist/apple/checksums.sha256
            storage/framework/desktop-dist/apple/apple-provenance.json
          if-no-files-found: ignore
          retention-days: 90
