<!--
  The Postline app icon: a signal dot on an ink tile, drawn on the 1024 grid
  macOS icons use, with the tile inset so the system shadow has room.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Postline">
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#0a0a0b"/>
  <circle cx="512" cy="512" r="132" fill="#f0441e"/>
</svg>
